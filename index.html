<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174c7e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='.9em' font-size='56'%3E%E3%82%AB%3C/text%3E%3C/svg%3E">
  <title>カタカナ RPG</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">
    <section id="loading-scene" class="scene is-active loading-scene">
      <div class="panel compact-panel">
        <div class="spinner" aria-hidden="true"></div>
        <h1>よみこみちゅう…</h1>
      </div>
    </section>

    <section id="title-scene" class="scene title-scene" hidden>
      <div class="title-card ui-frame-panel">
        <img class="ege-logo visual-asset" src="assets/images/branding/ege-logo.png" alt="Education Game Engine">
        <p class="eyebrow">よんで・ならべて・ぼうけん！</p>
        <h1>カタカナ RPG</h1>
        <button class="primary-button jumbo-button" data-action="show-modes">はじめる</button>
      </div>
    </section>

    <section id="mode-scene" class="scene" hidden>
      <div class="panel mode-panel">
        <h1>モードを えらぼう</h1>
        <div id="mode-list" class="mode-grid"></div>
        <button class="secondary-button" data-action="show-title">もどる</button>
      </div>
    </section>

    <section id="battle-scene" class="scene battle-scene" hidden>
      <div class="battle-layout">
        <header class="battle-header panel">
          <div class="progress-block">
            <span id="mode-name" class="badge"></span>
            <strong id="question-progress"></strong>
          </div>
          <button class="quiet-button" data-action="quit">やめる</button>
        </header>
        <div class="combatants panel">
          <div class="combatant hero-card">
            <img id="hero-image" class="combatant-image hero-image visual-asset" src="assets/images/characters/hero-main.png" alt="主人公">
            <div class="hp-info"><strong>ゆうしゃ</strong><span id="player-hp-text"></span></div>
            <div class="hp-track"><div id="player-hp-bar" class="hp-fill hero-hp"></div></div>
          </div>
          <div id="battle-message" class="battle-message" role="status">もじを ならべよう！</div>
          <div class="combatant enemy-card">
            <img id="enemy-image" class="combatant-image enemy-image visual-asset" src="assets/images/enemies/enemy-normal.png" alt="敵">
            <div class="hp-info"><strong>モンスター</strong><span id="enemy-hp-text"></span></div>
            <div class="hp-track"><div id="enemy-hp-bar" class="hp-fill enemy-hp"></div></div>
          </div>
        </div>
        <section class="question-panel panel ui-frame-panel">
          <div id="hint-area" class="hint-area" hidden>
            <img id="hint-image" alt="">
            <strong id="answer-reveal" class="answer-reveal" hidden></strong>
          </div>
          <p class="instruction">もじを おして ことばを つくろう</p>
          <div id="answer-slots" class="answer-slots" aria-label="こたえ"></div>
          <div id="letter-bank" class="letter-bank" aria-label="もじ"></div>
          <button id="confirm-answer" class="primary-button confirm-button" data-action="confirm" disabled>けってい</button>
        </section>
      </div>
    </section>

    <section id="result-scene" class="scene stage-end-scene" hidden>
      <div class="panel result-panel ui-frame-panel">
        <div id="result-icon" class="result-icon" aria-hidden="true"></div>
        <h1 id="result-title"></h1>
        <div id="result-stats" class="stats-grid"></div>
        <button id="result-next" class="primary-button jumbo-button">つぎへ</button>
      </div>
    </section>

    <section id="review-scene" class="scene stage-end-scene" hidden>
      <div class="panel review-panel ui-frame-panel">
        <h1>つまずいた ことば</h1>
        <p id="review-progress"></p>
        <img id="review-image" class="review-image" alt="">
        <div id="review-word" class="review-word"></div>
        <button class="primary-button" data-action="review-next">つぎへ</button>
      </div>
    </section>

    <section id="retry-scene" class="scene stage-end-scene" hidden>
      <div class="panel compact-panel ui-frame-panel">
        <div class="result-icon" aria-hidden="true">🌱</div>
        <h1>もういちど ちょうせんする？</h1>
        <button class="primary-button jumbo-button" data-action="retry">おなじモードでもういちど</button>
        <button class="secondary-button" data-action="today-words">きょうのことばをみる</button>
        <button class="quiet-button" data-action="end-session">タイトルにもどる</button>
      </div>
    </section>

    <section id="words-scene" class="scene" hidden>
      <div class="panel words-panel">
        <h1>きょうの ことば</h1>
        <p>このぼうけんで であった ことば</p>
        <div id="words-list" class="words-grid"></div>
        <button class="primary-button" data-action="end-session">タイトルにもどる</button>
      </div>
    </section>

    <section id="error-scene" class="scene" hidden>
      <div class="panel compact-panel">
        <div class="result-icon" aria-hidden="true">⚠️</div>
        <h1>ゲームを はじめられません</h1>
        <p id="error-message">データを よみこめませんでした。</p>
        <button class="primary-button" data-action="reload">もういちど よみこむ</button>
        <button class="secondary-button" data-action="show-title">タイトルにもどる</button>
      </div>
    </section>
  </main>

  <dialog id="quit-dialog" class="quit-dialog ui-frame-panel">
    <h2>ゲームを やめる？</h2>
    <p>いまの ぼうけんは きえます。</p>
    <div class="dialog-actions">
      <button class="danger-button" data-action="quit-to-title">タイトルにもどる</button>
      <button class="primary-button" data-action="continue">つづける</button>
    </div>
  </dialog>
  <script type="module" src="js/core/game-engine.js"></script>
</body>
</html>
